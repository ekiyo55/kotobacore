[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kotobacore"
version = "0.2.4"
description = "Japanese semantic understanding engine for LLM, RAG, SNS analysis, and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "KotobaCore Project" }
]
keywords = [
  "japanese",
  "nlp",
  "tokenizer",
  "semantic",
  "rag",
  "llm",
  "emotion-analysis",
  "karuizawa"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "PyYAML>=6.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]
ui = [
  "streamlit>=1.36.0",
]

[project.urls]
Homepage = "https://github.com/ekiyo55/kotobacore"
Repository = "https://github.com/ekiyo55/kotobacore"
Issues = "https://github.com/ekiyo55/kotobacore/issues"
Demo = "https://kotobacore.mooma.style/"

[project.scripts]
kotobacore = "kotobacore.cli.main:app"

[tool.setuptools.packages.find]
include = ["kotobacore*"]

[tool.setuptools.package-data]
kotobacore = [
  "py.typed",
  "resources/dict/*.csv",
  "resources/dict/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
